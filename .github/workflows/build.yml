name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Find Gradle
        id: gradle
        run: |
          echo "Project files:"
          ls -la
          find . -maxdepth 5 -name gradlew -type f

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          GRADLEW=$(find . -maxdepth 5 -name gradlew -type f | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: No Gradle wrapper found."
            echo "Inspect the project structure and identify its build system."
            exit 1
          fi

          DIR=$(dirname "$GRADLEW")
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NdrRacer-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
